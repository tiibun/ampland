[package]
name = "ampland"
version = "0.6.10"
edition = "2021"
default-run = "ampland"
description = "A fast, deterministic tool manager with native shims."
license = "MIT"
repository = "https://github.com/tiibun/ampland"
homepage = "https://github.com/tiibun/ampland"

[dependencies]
clap = { version = "4.5.3", features = ["derive"] }
directories = "6.0.0"
fs2 = "0.4.3"
globset = "0.4.21"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
semver = "1.0.22"
thiserror = "2.0.21"
toml = "1.2.1"
flate2 = "1.0.28"
sha2 = "0.11.1"
time = { version = "0.3.47", features = ["formatting"] }
tar = "0.4.46"
tempfile = "3.10.1"
ureq = "3.5.2"
xz2 = "0.1.7"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "manifest-generate"
path = "src/bin/manifest_generate/main.rs"
